<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=3" />
    <link rel="shortcut icon" href="/favicon.ico?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Priya Das | Portfolio</title>
    <meta name="description" content="Personal portfolio of Priya Das - Software Engineer specializing in Python, backend development, AI agents, and Android applications." />
    <!-- Fonts: Space Grotesk, Inter, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-obsidian-950 text-slate-100 antialiased selection:bg-cyber-cyan selection:text-obsidian-950 overflow-x-hidden">
    <div id="root">
      <!-- Instant HTML/CSS Loading Screen (Replaced once React mounts) -->
      <div id="global-preloader" style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0b0c10; z-index: 9999;">
        <div style="width: 32px; height: 32px; border: 2.5px solid rgba(6, 182, 212, 0.08); border-top: 2.5px solid #06b6d4; border-radius: 50%; animation: spin 0.85s linear infinite;"></div>
        <div style="margin-top: 14px; font-family: monospace; font-size: 10px; color: #06b6d4; letter-spacing: 0.22em; text-transform: uppercase; animation: pulse 1.6s infinite ease-in-out;">
          Initializing Systems
        </div>
      </div>
      <style>
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
